# The tuned FEX CPU modules, packed as an SD overlay for the A/B on the Switch
# (horizon-wine/fex/variants-build.md).
#
# Nothing here builds FEX. The tuning, the source tree, the compile and the
# release are the FEX work's (arena/21bcd47b-autorun, and berlint-hub/FEX for
# the tree it publishes from); this workflow only takes the published
# fex-opt release, checks it against its checksums and packs the same modules
# the main Build fetches into the SD archive as a small drop that needs no
# rebuild. What the modules are -- their tuning -- is read from the payload's
# own manifest and said on the card; nothing here decides it.
#
# Unpack the artifact's switch/ over the SD card and the variant is live;
# delete switch/wine/fex-variant.txt to go back to the pinned modules.
name: FEX variant

on:
  workflow_dispatch:
  # A change to this file is the only thing here that can change what is taken.
  push:
    branches: [ "arena/**" ]
    paths:
      - ".github/workflows/fex-variant.yml"

permissions:
  contents: read

jobs:
  fex-opt:
    name: The published FEX modules
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The FEX tree's own release first, this repository's second (the FEX
      # work publishes either); both carry the modules and their checksums, and
      # a download that does not match its checksum is no use.
      - name: Take the released modules
        id: fetch
        shell: bash
        run: |
          mkdir -p fetched
          taken=
          for owner in berlint-hub/FEX berlint-hub/autorun; do
            if curl -fsSL --retry 2 -o fetched/fex-opt-modules.zip \
                 "https://github.com/$owner/releases/download/fex-opt/fex-opt-modules.zip" \
               && curl -fsSL --retry 2 -o fetched/SHA256SUMS \
                 "https://github.com/$owner/releases/download/fex-opt/SHA256SUMS"; then
              (cd fetched && sha256sum -c SHA256SUMS)
              taken="$owner"
              break
            fi
          done
          if [ -z "$taken" ]; then
            echo "::error::No fex-opt release at berlint-hub/FEX or berlint-hub/autorun. The FEX work publishes the modules (horizon-wine/fex/fex-variant-release.yml is that workflow); nothing is built in this repository."
            echo "No fex-opt release to take; the FEX work publishes it." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "taken=$taken" >> "$GITHUB_OUTPUT"
          echo "The modules came from $taken's fex-opt release." >> "$GITHUB_STEP_SUMMARY"

      # The same overlay the main Build stages: the modules under system32, the
      # variant file that turns them on, and a note on the card that says what
      # it carries -- the tune comes from the payload's manifest, not from here.
      - name: Package the SD overlay
        shell: bash
        run: |
          stage=overlay/switch/wine
          mkdir -p "$stage/drive_c/windows/system32"
          python3 -c "import zipfile; zipfile.ZipFile('fetched/fex-opt-modules.zip').extractall('unpacked')"
          cp -r unpacked/switch/wine/. "$stage/"
          printf 'opt\n' > "$stage/fex-variant.txt"
          modules=$(cd "$stage/drive_c/windows/system32" && ls)
          for module in libwow64fex-opt.dll libarm64ecfex-opt.dll; do
            [ -f "$stage/drive_c/windows/system32/$module" ] || {
              echo "::error::The release has no $module: $modules"
              exit 1
            }
          done
          note=$(python3 - "$stage/fex-opt-manifest.json" <<'PY'
          import json, sys
          try:
              manifest = json.load(open(sys.argv[1]))
          except (OSError, ValueError):
              print('manifest v release není; tuning neuveden')
              raise SystemExit
          tune = manifest.get('tune')
          print(f'kód pro {tune}' if tune else 'bez tuningu (manifest tuning neuvádí)')
          PY
          )
          echo "The overlay carries: $modules; $note" >> "$GITHUB_STEP_SUMMARY"
          cat > "$stage/README-fex-opt.txt" <<EOF
          Vylepšený FEX (Tegra X1) pro A/B porovnání s původním.

          Rozbal překryv switch/ na SD kartu (na stejné místo jako archiv
          autorun). Překladač se vybírá v Game Settings → Emulation → CPU
          translator: Box64, FEX (původní), FEX optimized (vylepšený).
          fex-variant.txt je výchozí pro hry bez vlastního výběru (obsah
          "opt" = vylepšený). V logu poznáš, co běží:
              [CPU] FEX (libwow64fex-opt.dll)

          Tyhle moduly: $note (fex-opt-manifest.json).
          Postaveno a vydáno FEX prací; tenhle balík je jen převzatý release.
          EOF
          cat "$stage/README-fex-opt.txt"
          ls -la "$stage/drive_c/windows/system32"

      - name: Upload the SD overlay
        uses: actions/upload-artifact@v4
        with:
          name: fex-opt
          path: overlay/
          if-no-files-found: error
