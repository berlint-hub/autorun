# Build Autorun and run its host tests, the way build.sh and
# horizon-wine/tests/check-launcher-host.sh do on a machine. The runtime is
# built in the switch-dev image build.sh names, and what it produces is the SD
# card archive, uploaded here as the artifact.
name: Build

on:
  push:
    branches: [ "arena/**" ]
  workflow_dispatch:

jobs:
  tests:
    name: Host tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libsdl2-dev libsdl2-ttf-dev libpng-dev fonts-dejavu-core libssl-dev

      # The FEX modules are not built here: this checks that the workflows only
      # take the FEX work's release, and that the docs still say who builds and
      # who packs -- the split that keeps the A/B honest.
      - name: FEX payload source
        run: python3 horizon-wine/tests/check_fex_payload_source.py

      # The FEX-2610 memory-layer patch: made against the pinned commit, and
      # carrying this repository's ABI headers byte for byte rather than a
      # second copy that can drift. No FEX tree is needed for either.
      - name: FEX 2610 memory patch
        run: python3 horizon-wine/tests/check_fex_2610_patch.py

      # The flag that decides 2 GiB or 4 GiB for a 32-bit program: the tool
      # edits one bit and the checksum, and the test is what says it does not
      # edit the rest of the image.
      - name: Large Address Aware tool
        run: python3 horizon-wine/tests/check_large_address_aware.py

      - name: Input profiles
        run: |
          cc -std=gnu11 -Wall -Wextra -Werror -O1 -g \
            horizon-wine/tests/input_profile.c horizon-wine/source/input_profile.c \
            -lm -o input_profile
          ./input_profile

      - name: DXVK options and Sarek releases
        run: |
          cc -std=gnu11 -Wall -Wextra -Werror -O1 -g \
            horizon-wine/tests/dxvk_options.c horizon-wine/source/dxvk_options.c \
            -o dxvk_options
          ./dxvk_options

      - name: Screen fit
        run: |
          cc -std=gnu11 -Wall -Wextra -Werror -O1 -g \
            -I horizon-wine/source \
            horizon-wine/tests/screen_fit.c -o screen_fit
          ./screen_fit

      # A screen that shows no frame, read from the numbers the stall report
      # already has: which of the ways a stuck swap leaves it empty is, so the
      # log says why and not only how many slots there are.
      - name: Swap stall verdict
        run: |
          cc -std=gnu11 -Wall -Wextra -Werror -O1 -g \
            -I horizon-wine/source \
            horizon-wine/tests/nxgl_verdict.c -o nxgl_verdict
          ./nxgl_verdict

      # Which panel rate a measured frame rate asks for: the policy behind
      # SaltyNX's handheld 45-60 Hz display sync, which needs no console to test.
      - name: Display sync rate policy
        run: |
          cc -std=gnu11 -Wall -Wextra -Werror -O1 -g \
            -I horizon-wine/source \
            horizon-wine/tests/display_sync.c -o display_sync
          ./display_sync

      # The SaltySD bridge against a fake console: which named port is asked
      # for, how the CMIF reply is read, which rate the panel is asked for and
      # that FPSlocked goes back as it was found.
      - name: SaltySD display bridge
        run: |
          cc -std=gnu11 -Wall -Wextra -Werror -O1 -g -fsanitize=address,undefined \
            -D__SWITCH__ -D WINE_NX_SALTY_TEST \
            -I horizon-wine/source -I horizon-wine/tests/salty_shim \
            horizon-wine/tests/salty_display.c horizon-wine/source/salty_display.c \
            -o salty_display
          ./salty_display

      - name: Log flood fold
        run: |
          cc -std=gnu11 -Wall -Wextra -Werror -O1 -g \
            -I horizon-wine/source \
            horizon-wine/tests/log_repeat.c -o log_repeat
          ./log_repeat

      # Where KUSER_SHARED_DATA ends up under the 32-bit forwarder: whether a
      # page found for it can carry the pointer the guest's ntdll is given, and
      # that the Windows address is never the page the reads are served from.
      - name: Shared data placement
        run: |
          cc -std=gnu11 -Wall -Wextra -Werror -O1 -g \
            horizon-wine/tests/shared_data_place.c -o shared_data_place
          ./shared_data_place

      # What the linker is asked for when nxvk is the Mesa: its OpenGL set and
      # its Vulkan driver whole-archived, its support archives after them in a
      # group, and a configure that stops with the nxvk target to run when one
      # of them is missing. No toolchain is involved, the trees are made up.
      - name: nxvk archives
        run: cmake -P horizon-wine/tests/nxvk_archives.cmake

      # The profiler's sample handling, and the i386 CONTEXT offsets the stall
      # report reads a program's own registers through.
      - name: Thread profiler
        run: |
          cc -std=gnu11 -Wall -Wextra -Werror -O1 -g \
            -I horizon-wine/source \
            horizon-wine/tests/thread_profile.c -o thread_profile
          ./thread_profile

      # The translator's code cache on the card: what one configuration is,
      # which one is given back first when the card has no room for another,
      # and that a card without a cache is left alone.
      - name: FEX code cache
        run: |
          cc -std=gnu11 -Wall -Wextra -Werror -O1 -g -I horizon-wine/source \
            horizon-wine/tests/fex_cache.c horizon-wine/source/fex_cache.c \
            -o fex_cache
          ./fex_cache

      # The launcher's own logic that needs no SDL: the play time a game keeps,
      # the bundles that set a game's emulation and frame pacing at once, and the
      # copy of the settings a card can be put back to.
      - name: Launcher library, presets and backups
        run: |
          cc -std=gnu11 -Wall -Wextra -Werror -O1 -g -I horizon-wine/source \
            horizon-wine/tests/launcher_catalog.c horizon-wine/source/launcher_catalog.c \
            -o launcher_catalog
          ./launcher_catalog
          cc -std=gnu11 -Wall -Wextra -Werror -O1 -g -I horizon-wine/source \
            horizon-wine/tests/launcher_preset.c horizon-wine/source/launcher_preset.c \
            -o launcher_preset
          ./launcher_preset
          cc -std=gnu11 -Wall -Wextra -Werror -O1 -g -I horizon-wine/source \
            horizon-wine/tests/launcher_backup.c horizon-wine/source/launcher_backup.c \
            -o launcher_backup
          ./launcher_backup
          cc -std=gnu11 -Wall -Wextra -Werror -O1 -g -I horizon-wine/source \
            horizon-wine/tests/launcher_settings.c -o launcher_settings
          ./launcher_settings

      # The boot setup: the Hekate entry it writes, the loader it replaces, and
      # what it puts back when a power cut stops it half way.
      - name: Boot setup and recovery
        run: python3 horizon-wine/tests/check_setup_boot.py

      - name: XInput Switch controller and prompt identity
        run: |
          cc -std=gnu11 -Wall -Wextra -Werror -O1 -g \
            -D__WINESRC__ -DWINE_UNIX_LIB -D_WIN64 \
            -I horizon-wine/tests/xinput-shims -I include \
            horizon-wine/tests/xinput_nx_pad.c horizon-wine/source/input_profile.c \
            -lm -o xinput_pad
          ./xinput_pad

      - name: DirectInput input (raw payload and low-level hooks)
        run: |
          python3 horizon-wine/tests/check_raw_mouse.py
          python3 horizon-wine/tests/check_ll_hooks.py

      # The screen and input driver, its OpenGL surfaces and the server's
      # thread and file objects: real functions sliced out of the driver, run
      # against stubs under ASan and UBSan.  The host compiler is gcc here, and
      # the two that default to clang are told so.
      - name: Screen, input and server host tests
        run: |
          export WINE_NX_HOST_CC=cc
          for t in check_pointer_events check_popup_restore check_gl_surfaces \
                   check_render_overhead check_horizon_thread_fds \
                   check_capture_context check_wow64_unix_tables \
                   check_horizon_thread_handles; do
            python3 "horizon-wine/tests/$t.py"
          done

      - name: Floating keyboard and controls overlay
        run: |
          cc -std=gnu11 -Wall -Wextra -Werror -O1 -g $(sdl2-config --cflags) \
            -I horizon-wine/source \
            horizon-wine/tests/osk.c horizon-wine/source/osk.c \
            horizon-wine/source/controls_overlay.c horizon-wine/source/input_profile.c \
            $(sdl2-config --libs) -lSDL2_ttf -lpng -lm -o osk
          mkdir -p "$PWD/shots"
          ./osk /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf "$PWD/shots"
          cc -std=gnu11 -Wall -Wextra -Werror -O1 -g $(sdl2-config --cflags) \
            -I horizon-wine/source \
            horizon-wine/tests/controls_overlay.c horizon-wine/source/controls_overlay.c \
            horizon-wine/source/input_profile.c \
            $(sdl2-config --libs) -lSDL2_ttf -lpng -lm -o controls_overlay
          ./controls_overlay /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf "$PWD/shots"

      - name: Upload the overlay's pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-shots
          path: shots/
          if-no-files-found: ignore

  build:
    name: Build the runtime
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true   # horizon-dlls is checked against, game-fixes is packed in

      # switch-dev and the runtime's build trees are large: give Docker the big
      # scratch disk and drop the tools this build does not use.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift \
            /opt/microsoft /usr/local/graalvm /usr/local/.ghcup
          sudo docker image prune -af
          sudo systemctl stop docker docker.socket
          sudo mkdir -p /mnt/docker
          sudo rsync -a /var/lib/docker/ /mnt/docker/
          echo '{"data-root":"/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          df -h / /mnt

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bison flex

      # The llvm-mingw toolchain and the boot payloads build.sh makes once are
      # the slowest part to fetch or make again; the switch-dev image names what
      # they were built against, and the boot payload's own sources say when it
      # is time to build them again. Only what the build reuses is kept: the
      # payload build's own checkouts are dropped, so a restored cache never
      # lands git on files another user made. Saved even when the build fails.
      - name: Restore toolchains and boot payloads
        uses: actions/cache/restore@v4
        with:
          path: |
            horizon-wine/toolchains/llvm-mingw-*
            horizon-wine/toolchains/boot-payloads/bundle
          key: toolchains-${{ hashFiles('horizon-wine/switch-dev.txt', 'horizon-wine/build-boot-bundle.sh', 'horizon-wine/mesosphere/**') }}
          restore-keys: toolchains-

      # The tuned FEX modules, taken from whichever fex-opt release the FEX
      # work published: berlint-hub/FEX's own first, this repository's second.
      # Nothing is built here -- the tuning is that work's (variants-build.md).
      # They are staged into the package with the variant file that turns them
      # on; a build reached without a release ships the pinned modules alone,
      # and says so.
      - name: Fetch the tuned FEX
        shell: bash
        run: |
          mkdir -p horizon-wine/fex/opt-modules
          for owner in berlint-hub/FEX berlint-hub/autorun; do
            if curl -fsSL --retry 2 -o "$RUNNER_TEMP/fex-opt-modules.zip" \
                 "https://github.com/$owner/releases/download/fex-opt/fex-opt-modules.zip" \
               && curl -fsSL --retry 2 -o "$RUNNER_TEMP/SHA256SUMS" \
                 "https://github.com/$owner/releases/download/fex-opt/SHA256SUMS"; then
              (cd "$RUNNER_TEMP" && sha256sum -c SHA256SUMS)
              python3 -c "import zipfile; zipfile.ZipFile(r'$RUNNER_TEMP/fex-opt-modules.zip').extractall('horizon-wine/fex/opt-modules')"
              printf 'opt\n' > horizon-wine/fex/opt-modules/switch/wine/fex-variant.txt
              echo "Tuned FEX taken from $owner:" \
                "$(ls horizon-wine/fex/opt-modules/switch/wine/drive_c/windows/system32)" \
                >> "$GITHUB_STEP_SUMMARY"
              break
            fi
          done
          [ -f horizon-wine/fex/opt-modules/switch/wine/fex-variant.txt ] || \
            echo "::warning::No fex-opt release (berlint-hub/FEX or berlint-hub/autorun): the archive ships the pinned modules alone."

      # build.sh tees to build.log so a failure can say why in annotations,
      # which the job's checks carry even when the log archive is out of reach.
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          if sh build.sh --jobs "$(nproc)" 2>&1 | tee build.log; then
            exit 0
          fi
          tail -n 12 build.log | tr '\n' '\v' | sed 's/%/%25/g; s/\v/%0A/g' | cut -c1-3400 | \
            xargs -0 -I{} echo "::error::build.log tail: {}"
          df -h | tr '\n' ';' | sed 's/%/%25/g' | xargs -0 -I{} echo "::notice::disk: {}"
          sudo docker images | tr '\n' ';' | sed 's/%/%25/g' | cut -c1-1500 | xargs -0 -I{} echo "::notice::images: {}"
          exit 1

      # The three NCAs a forwarder is made of, built and taken apart again: the
      # loader's NPDM comes out of the build dir just made, since it is what the
      # address space is patched into.
      - name: Check the forwarder NCAs
        run: |
          npdm=""
          for dir in horizon-wine/build-switch-wow64-mesa-switch horizon-wine/build-switch-amd64; do
            [ -f "$dir/hbl-main.npdm" ] && { npdm="$dir/hbl-main.npdm"; break; }
          done
          test -n "$npdm"
          mkdir -p "$RUNNER_TEMP/switch-shim" "$RUNNER_TEMP/ncas"
          cp horizon-wine/tests/switch_shim.h "$RUNNER_TEMP/switch-shim/switch.h"
          cc -std=gnu11 -Wall -Wextra -Werror -Wno-unused-parameter -Wno-format-truncation -O1 -g \
            -I horizon-wine/tests -I "$RUNNER_TEMP/switch-shim" \
            horizon-wine/tests/forwarder_build.c -o "$RUNNER_TEMP/forwarder_build"
          "$RUNNER_TEMP/forwarder_build" "$npdm" horizon-wine/assets/autorun.jpg "$RUNNER_TEMP/ncas"

      - name: Save toolchains and boot payloads
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            horizon-wine/toolchains/llvm-mingw-*
            horizon-wine/toolchains/boot-payloads/bundle
          key: toolchains-${{ hashFiles('horizon-wine/switch-dev.txt', 'horizon-wine/build-boot-bundle.sh', 'horizon-wine/mesosphere/**') }}-${{ github.run_id }}

      - name: Upload the SD card archive
        uses: actions/upload-artifact@v4
        with:
          name: autorun
          path: horizon-wine/build-autorun/autorun-*.zip
          if-no-files-found: error
