# The checks that run on an ordinary x86_64 machine: every script compiles,
# every shell script parses, every JSON file loads, and the host tests that do
# not need a Switch, an ARM64 host or a container.  The ARM64 and Switch builds
# stay in .gitlab-ci.yml, which needs a runner with devkitA64 and Docker.
name: Checks

on:
  push:
    branches: [ main, "arena/**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: Syntax
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Python files compile
        run: |
          set -eu
          git ls-files -z '*.py' | xargs -0 python3 -m py_compile

      - name: Shell scripts parse
        run: |
          set -eu
          git ls-files -z '*.sh' | xargs -0 -n1 sh -n

      - name: JSON files load
        run: |
          set -eu
          python3 - <<'PY'
          import json
          import subprocess

          files = subprocess.run( [ 'git', 'ls-files', '-z', '*.json' ], capture_output=True, check=True ).stdout.decode().split( '\0' )
          files = [ name for name in files if name ]
          for name in files:
              with open( name, 'rb' ) as file:
                  json.load( file )
          print( f'{len( files )} JSON files load' )
          PY

  host-tests:
    name: Host tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The C fixtures are written for clang's diagnostics; tests/test_support.py
      # falls back to cc, so a machine without it still runs them.
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang

      # Every failure is its own annotation naming the file, so it is findable
      # without the log; a run goes on to the other tests either way.
      - name: Host tests
        run: |
          failed=0
          for test in horizon-wine/tests/check_*.py; do
              echo "::group::$test"
              python3 "$test" || {
                  failed=1
                  echo "::error file=$test,title=Check failed::$test"
              }
              echo "::endgroup::"
          done
          exit $failed

      # Each script prints SKIP and exits 0 when its tool, host or checkout is
      # missing, so the ones that can run here run and the rest say why not.
      - name: Runtime and console tests
        run: |
          failed=0
          for script in horizon-wine/check-*.sh horizon-wine/tests/check-*.sh; do
              echo "::group::$script"
              sh "$script" || {
                  failed=1
                  echo "::error file=$script,title=Check failed::$script"
              }
              echo "::endgroup::"
          done
          exit $failed

  build:
    name: Build the runtime
    # Everything the console runs: the PE side, the Switch runtime and the SD
    # card archive, made by the project's own build.sh in the switch-dev image.
    # The first run on a branch has no cache and fetches llvm-mingw and builds
    # the boot payloads; later runs reuse them.
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true   # horizon-dlls is checked against, game-fixes is packed in

      # switch-dev and the build trees are large: give Docker the big scratch
      # disk and drop the tools this build does not use.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift \
            /opt/microsoft /usr/local/graalvm /usr/local/.ghcup
          sudo docker image prune -af
          sudo systemctl stop docker docker.socket
          sudo mkdir -p /mnt/docker
          sudo rsync -a /var/lib/docker/ /mnt/docker/
          echo '{"data-root":"/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          df -h / /mnt

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bison flex unzip zip

      # The llvm-mingw toolchain and the boot payloads build.sh makes once are
      # the slowest part to fetch or make again; both are kept between runs.
      - name: Restore toolchains and boot payloads
        uses: actions/cache/restore@v4
        with:
          path: |
            horizon-wine/toolchains/llvm-mingw-*
            horizon-wine/toolchains/boot-payloads/bundle
          key: toolchains-${{ hashFiles('horizon-wine/switch-dev.txt', 'horizon-wine/build-boot-bundle.sh', 'horizon-wine/mesosphere/**') }}
          restore-keys: toolchains-

      # build.sh tees to build.log so a failure can say why in annotations,
      # which the job's checks carry even when the log archive is out of reach.
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          if sh build.sh --jobs "$(nproc)" 2>&1 | tee build.log; then
            exit 0
          fi
          tail -n 12 build.log | tr '\n' '\v' | sed 's/%/%25/g; s/\v/%0A/g' | cut -c1-3400 | \
            xargs -0 -I{} echo "::error::build.log tail: {}"
          df -h | tr '\n' ';' | sed 's/%/%25/g' | xargs -0 -I{} echo "::notice::disk: {}"
          exit 1

      # What the build made, for the record and for a card: the archive if it
      # was written, and the log either way.
      - name: Upload the SD card archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autorun-sd-card
          path: |
            horizon-wine/build-autorun/*.zip
            build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Save toolchains and boot payloads
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            horizon-wine/toolchains/llvm-mingw-*
            horizon-wine/toolchains/boot-payloads/bundle
          key: toolchains-${{ hashFiles('horizon-wine/switch-dev.txt', 'horizon-wine/build-boot-bundle.sh', 'horizon-wine/mesosphere/**') }}
